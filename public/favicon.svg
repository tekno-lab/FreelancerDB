<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="tlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#0f172a" />
  <rect x="20" y="20" width="472" height="472" rx="108" fill="none" stroke="url(#tlGrad)" stroke-width="8" opacity="0.4" />
  <!-- Stylized TL Monogram -->
  <path d="M120 160 H392 V210 H286 V380 H226 V210 H120 Z" fill="url(#tlGrad)" filter="url(#glow)" />
  <path d="M280 330 H380 V380 H280 Z" fill="#38bdf8" />
